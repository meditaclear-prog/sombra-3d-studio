cd ~/SOMBRA3D/projeto-nuvem
cat > .github/workflows/android-apk.yml <<'EOF'
name: Build SOMBRA Android APK
on:
workflow_dispatch:
permissions:
contents: read
jobs:
build-apk:
runs-on: ubuntu-latest
steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install dependencies
    run: npm install

  - name: Build web assets
    run: npm run build

  - name: Create Android project
    run: npx cap add android

  - name: Configure AdMob for Android
    run: node scripts/configure-android-admob.mjs

  - name: Sync Capacitor
    run: npx cap sync android

  - name: Build debug APK
    working-directory: android
    run: ./gradlew assembleDebug

  - name: Upload APK for testing
    uses: actions/upload-artifact@v4
    with:
      name: SOMBRA-3D-STUDIO-debug-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14

EOF
